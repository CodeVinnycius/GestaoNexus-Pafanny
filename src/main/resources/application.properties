# ══════════════════════════════════════════════════════════════
#  GestãoNexus — application.properties
#
#  Este arquivo NÃO contém segredos — todo valor sensível vem de
#  variáveis de ambiente. Sem elas definidas, a aplicação falha ao
#  iniciar (fail-fast), em vez de subir com uma senha/chave fraca.
#
#  Configure as variáveis antes de rodar — veja o
#  application.properties.example na raiz do projeto.
# ══════════════════════════════════════════════════════════════

server.port=${SERVER_PORT:8080}

# ── Segurança de cookies (para futuras sessões) ───────────────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ── Banco de dados ─────────────────────────────────────────────
# Por padrão usa H2 embutido (arquivo local, sem servidor).
# Em produção, defina DB_URL/DB_USERNAME/DB_PASSWORD/DB_DRIVER
# apontando para o banco real (ex.: MySQL) — veja o README.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/estoque;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 DESABILITADO — habilite apenas localmente se necessário
spring.h2.console.enabled=false

# ── JWT ───────────────────────────────────────────────────────
# OBRIGATÓRIO — sem valor padrão de propósito.
# Chave em Base64 (mínimo 32 bytes / 256 bits para HS256).
# Gerar chave forte: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET}
# Expiração: 8 horas em ms (8 * 60 * 60 * 1000)
app.jwt.expiration=${APP_JWT_EXPIRATION:28800000}

# ── Admin padrão (criado na 1ª inicialização) ─────────────────
# APP_ADMIN_SENHA é OBRIGATÓRIO — sem valor padrão de propósito.
app.admin.login=${APP_ADMIN_LOGIN:admin}
app.admin.senha=${APP_ADMIN_SENHA}

# ── Loja pública (/loja.html + /api/loja) ──────────────────────
# Login da Empresa cujos produtos aparecem na loja pública
app.loja.empresa-login=${APP_LOJA_LOGIN:pafanny}
# Número de WhatsApp da loja (formato internacional, sem espaços/símbolos: 55DDDNUMERO)
app.loja.whatsapp=${APP_LOJA_WHATSAPP:5511986032979}
# Instagram da marca (sem @)
app.loja.instagram=${APP_LOJA_INSTAGRAM:usepafanny}

# ── Uploads (fotos de produto) ──────────────────────────────────
app.uploads.dir=${APP_UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Erros: NUNCA expõe stack trace ou mensagens internas ─────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ── Logs ──────────────────────────────────────────────────────
logging.level.com.estoque=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
