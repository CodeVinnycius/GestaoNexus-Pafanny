# Só para os testes. Fica em config/ para sobrepor o application.properties principal sem
# substituí-lo: o resto da configuração continua valendo.
# Banco em memória e pastas temporárias, para o "mvn test" nunca abrir o banco real em data/.
spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
app.uploads.dir=${java.io.tmpdir}/gestaonexus-testes/uploads
app.data.dir=${java.io.tmpdir}/gestaonexus-testes
# Chave e senha descartáveis, que só existem aqui.
app.jwt.secret=dGVzdGVzLWRvLWdlc3Rhb25leHVzLWNoYXZlLWRlLTMyLWJ5dGVzIQ==
app.admin.senha=senha-dos-testes
